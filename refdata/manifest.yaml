# 기준 데이터 릴리스 — 업무정의서 3.4-10, 9장
#
# 의뢰는 의뢰 대상을 확정할 때 current 릴리스 ID 를 남기고, 이후 그 릴리스의 기준 데이터를 따른다.
# 릴리스는 데이터셋마다 버전 파일(refdata/<데이터셋>/<버전>.*) 하나를 가리킨다.
#
# 기준 데이터를 바꾸는 방법
#   1. 새 버전 파일을 만든다. 원본에서 만드는 데이터는 python -m h12.reference.build <버전>
#      기존 버전 파일은 고치지 않는다 (고치면 그 버전으로 확정한 의뢰가 바뀐다)
#   2. 아래에 새 릴리스를 추가하고, 바뀌지 않은 데이터셋은 이전 버전을 그대로 적는다
#   3. current 를 새 릴리스로 옮긴다. 이전 릴리스는 지우지 않는다
#
# 운영 전(5단계 DB 이전)에는 어떤 의뢰도 릴리스를 남기지 않았으므로 R2026-10-30 에 조건 매핑을 더했다 (3단계).
# 운영을 시작한 뒤에는 기존 릴리스를 고치지 않는다.

current: R2026-10-30

releases:
  R2026-10-30:
    taxonomy: "2026-10-30"
    hx_catalog: "2026-10-30"
    pms: "2026-10-30"
    measurement_standards: "2026-10-30"
    condition_mapping: "2026-10-30"
