# 열교환기 Catalog 변환 규칙 — 업무정의서 5.3.4, 9장
#
# 원본 시트에서 사양 네 열과 표준 여부만 가져온다. 압력손실 측정값은 업무 규칙에서 쓰지 않는다.
# 1~2행은 머리글이고, 3행부터 핀타입이 빈 행 직전까지가 사양이다 (그 아래는 집계 행).

source:
  file: ../docs/열교환기압력손실DB_Final.xlsx    # 저장소 루트 기준
  sheet: 압손DB_과제결과
  header_row: 1
  first_data_row: 3

# 원본 머리글 → 저장 키. 머리글이 다르면 변환을 멈춘다
columns:
  관경: tube_diameter
  핀타입: fin_type
  열수: row_count
  FPI: fpi
  표준 여부: standard

# 표준 여부 표시
standard_marks: { O: true, X: false }
