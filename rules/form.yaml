# 의뢰 내용 — 업무정의서 4.3, 4.4
#
# kind      text | date | choice (options 는 rules/options.yaml 의 목록 이름)
# required  true | false | { request_type: [코드...] }  (그 의뢰 유형일 때만 필수)
# 자유 입력(text)은 200자를 넘을 수 없다 (5.1)

basic_info:
  division:       { label: 사업부, kind: choice, options: requester_division, required: true }
  department:     { label: 부서, kind: text, required: true }
  requester_name: { label: 요청자, kind: text, required: true }
  requester_role: { label: 직급, kind: choice, options: requester_role, required: true }

analysis_overview:
  request_type:              { label: 의뢰 유형, kind: choice, options: request_type, required: true }
  request_type_other:        { label: 의뢰 유형 (직접 입력), kind: text, required: { request_type: [OTHER] } }
  development_grade:         { label: 개발 등급, kind: choice, options: development_grade,
                               required: { request_type: [DEVELOPMENT_PROJECT] } }
  npi_stage:                 { label: NPI 단계, kind: choice, options: npi_stage,
                               required: { request_type: [DEVELOPMENT_PROJECT] } }
  model_suffix:              { label: 모델명 (Model Suffix), kind: text, required: true }
  desired_completion_date:   { label: 희망 완료일, kind: date, required: true }
  request_description:       { label: 해석을 요청하게 된 배경, kind: text, required: true }
  additional_result_request: { label: 해석으로 확인하고 싶은 내용, kind: text, required: true }
  decision_use:              { label: 결과 활용 목적, kind: choice, options: decision_use, required: false }

# 4.4 해당 사업부의 PMS 프로젝트를 반드시 골라야 하는 의뢰 유형
pms_required_for: [DEVELOPMENT_PROJECT]

# 4.5 도면번호 형식: 영문·숫자·하이픈
drawing_no_pattern: "^[A-Za-z0-9-]+$"
