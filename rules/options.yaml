# 의뢰서 선택지 — 업무정의서 4.2, 4.3
#
# choices      목록이면 값이 곧 코드다. {코드: 표시 이름} 이면 코드를 저장한다
# allow_custom "직접 입력" 을 허용한다
# default      기본값 (코드)
#
# 코드는 정의서 부록 C 에 있는 것(analysis_scope, decision_use)은 그대로 쓰고,
# 의뢰 유형처럼 업무 규칙(4.4)이 값을 가리키는 목록만 코드를 따로 정했다 (docs/spec-gaps.md G-17).

# 4.2 해석 범위 (RAC Window 제품일 때만)
analysis_scope:
  choices: { indoor: 실내측, outdoor: 실외측, both: 실내·실외 모두 }

# 4.2 운전 구분 (통합형 제품일 때만)
operation_mode:
  choices: [실내, 실외, 동시운전]
  default: 실내

# 4.2 냉각 방식 (PCB발열일 때만)
cooling_method:
  choices: [공랭식, 수랭식]

# 4.3 사업부 (의뢰자 소속). 의뢰 대상의 제품 사업부와 다른 항목이다
requester_division:
  choices: [SAC, RAC, Aircare, Chiller, 연구소]
  allow_custom: true

# 4.3 직급
requester_role:
  choices: [책임연구원, 선임연구원, 연구원]
  allow_custom: true

# 4.3 의뢰 유형. 기타를 고르면 의뢰 유형을 직접 입력한다 (4.4)
request_type:
  choices:
    DEVELOPMENT_PROJECT: 개발 프로젝트
    QUALITY_IMPROVEMENT: 품질 개선
    FIELD_ISSUE: 필드 이슈
    PRE_STUDY: 선행 검토
    OTHER: 기타

# 4.3 개발 등급. 정의서의 예시(A, B, Ca, Cb, D, JDM, ODM)와 PMS 원본(2026-09-15)의 Grade 값 전체 (G-16)
development_grade:
  choices: [
    A, B, B_Mi, Ca, Ca_Mi, Ca_SW, Cb, Cc, Csw, D, HW,
    ND_Cb, ND_D,
    JDM, JDM_Ca, JDM_Cb, JDM_D, JDM_파급,
    ODM, ODM_CSKD, ODM_ND, ODM_OTS, ODM_파급, OTS_파생,
    ECM_A, ECM_Cb,
    T1, T2, T3,
  ]
  allow_custom: true

# 4.3 NPI 단계
npi_stage:
  choices: [CP, DV, PV, MQ, MP, Pre MP, 미정]
  allow_custom: true

# 4.3 결과 활용 목적 (부록 C.3 의 코드)
decision_use:
  choices:
    problem_analysis: 문제 분석
    design_review: 설계 검토
    performance_validation: 성능 검증
    other: 기타
    undecided: 미정
