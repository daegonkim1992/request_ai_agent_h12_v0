# 해석의뢰 업무 흐름 규칙 — 업무정의서 3장
#
# 이 파일이 상태, 기능, 할 일 목록의 단일 기준이다. 엔진(backend/h12/domain/workflow)은
# 여기 적힌 이름만 해석한다. 새 수행자·조건·효과가 필요할 때만 코드를 고친다.
#
# actors (수행자)
#   requester        의뢰를 만든 의뢰자
#   manager          해석관리자
#   assigned_analyst 현재 배정된 해석담당자
#   holder           보류한 사람
# pending (허용하는 대기 요청, 하나 또는 목록. 생략하면 따지지 않음)
#   none / change / cancel
# requires (필수 입력)
#   reason_code  사유 코드 (reason_codes 로 코드 집합 지정, reason_codes.yaml)
#   comment      설명·사유 텍스트
#   analyst      담당자 (해석담당자 역할이어야 함)
#   form         변경한 의뢰서
#   result_summary 결과 요약
# checks
#   submission   제출 조건 (8장). 진행 중 변경은 제안된 의뢰서에 적용한다
# effects (순서대로 적용)
#   create_revision, assign_analyst, record_holder, clear_holder,
#   open_change, apply_change, open_cancel, close_pending, add_result

statuses:
  DRAFT:                       { label: 작성 중 }
  UNDER_REVIEW:                { label: 검토 중 }
  REVISION_REQUESTED:          { label: 보완 필요 }
  IN_PROGRESS:                 { label: 해석 진행 중 }
  ANALYSIS_REVISION_REQUESTED: { label: 해석 중 보완 필요 }
  ON_HOLD:                     { label: 보류 }
  RESULT_REVIEW:               { label: 결과 확인 필요 }
  COMPLETED:                   { label: 완료, terminal: true }
  REJECTED:                    { label: 반려, terminal: true }
  CANCELLED:                   { label: 취소, terminal: true }

initial_status: DRAFT

# 3.4-1 의뢰자가 의뢰서 내용을 고칠 수 있는 상태
editable_statuses: [DRAFT, REVISION_REQUESTED, ANALYSIS_REVISION_REQUESTED]

# 3.4-4 이 대기 요청이 있으면 그 요청을 처리하는 기능(pending 에 그 요청을 적은 기능)만 할 수 있다.
# 의뢰서 수정과 할 일 목록에도 같이 적용한다
exclusive_pending: [cancel]

# 3.2 기능. transitions 는 {현재 상태: 결과 상태}, 결과 상태가 null 이면 상태 유지
actions:
  submit:
    label: 제출
    event: SUBMITTED
    actors: [requester]
    transitions: { DRAFT: UNDER_REVIEW }
    checks: [submission]
    effects: [create_revision]

  request_review_supplement:
    label: 보완 요청 (검토 단계)
    event: SUPPLEMENT_REQUESTED
    actors: [manager]
    transitions: { UNDER_REVIEW: REVISION_REQUESTED }
    requires: [reason_code, comment]
    reason_codes: supplement

  reject:
    label: 반려
    event: REJECTED
    actors: [manager]
    transitions: { UNDER_REVIEW: REJECTED }
    requires: [reason_code, comment]
    reason_codes: reject

  accept_and_assign:
    label: 접수·배정
    event: ACCEPTED
    actors: [manager]
    transitions: { UNDER_REVIEW: IN_PROGRESS }
    requires: [analyst]
    effects: [assign_analyst]

  resubmit:
    label: 재제출
    event: RESUBMITTED
    actors: [requester]
    # 3.4-2 보완을 요청한 쪽으로 돌아간다
    transitions:
      REVISION_REQUESTED: UNDER_REVIEW
      ANALYSIS_REVISION_REQUESTED: IN_PROGRESS
    checks: [submission]
    effects: [create_revision]

  request_analysis_supplement:
    label: 보완 요청 (해석 단계)
    event: ANALYSIS_SUPPLEMENT_REQUESTED
    actors: [assigned_analyst, manager]
    transitions: { IN_PROGRESS: ANALYSIS_REVISION_REQUESTED }
    # 변경 요청이 대기 중이면 먼저 수락·거절해야 한다 (3.4-4)
    pending: none
    requires: [reason_code, comment]
    reason_codes: supplement

  hold:
    label: 보류
    event: HELD
    actors: [assigned_analyst, manager]
    transitions: { IN_PROGRESS: ON_HOLD }
    requires: [reason_code, comment]
    reason_codes: hold
    effects: [record_holder]

  resume:
    label: 재개
    event: RESUMED
    actors: [holder, manager]
    transitions: { ON_HOLD: IN_PROGRESS }
    effects: [clear_holder]

  reassign:
    label: 재배정
    event: REASSIGNED
    actors: [manager]
    transitions:
      IN_PROGRESS: null
      ANALYSIS_REVISION_REQUESTED: null
      ON_HOLD: null
    requires: [analyst, comment]
    effects: [assign_analyst]

  request_change:
    label: 진행 중 변경 요청
    event: CHANGE_REQUESTED
    actors: [requester]
    transitions: { IN_PROGRESS: null }
    pending: none
    requires: [form, comment]
    checks: [submission]
    effects: [open_change]

  accept_change:
    label: 진행 중 변경 수락
    event: CHANGE_ACCEPTED
    actors: [assigned_analyst]
    transitions: { IN_PROGRESS: null }
    pending: change
    effects: [apply_change, create_revision, close_pending]

  decline_change:
    label: 진행 중 변경 거절
    event: CHANGE_DECLINED
    actors: [assigned_analyst]
    transitions: { IN_PROGRESS: null }
    pending: change
    requires: [comment]
    effects: [close_pending]

  cancel:
    label: 취소
    event: CANCELLED
    actors: [requester]
    transitions:
      DRAFT: CANCELLED
      UNDER_REVIEW: CANCELLED
      REVISION_REQUESTED: CANCELLED

  request_cancel:
    label: 취소 요청
    event: CANCEL_REQUESTED
    actors: [requester]
    transitions:
      IN_PROGRESS: null
      ANALYSIS_REVISION_REQUESTED: null
      ON_HOLD: null
    pending: none
    requires: [comment]
    effects: [open_cancel]

  approve_cancel:
    label: 취소 요청 승인
    event: CANCEL_APPROVED
    actors: [manager]
    transitions:
      IN_PROGRESS: CANCELLED
      ANALYSIS_REVISION_REQUESTED: CANCELLED
      ON_HOLD: CANCELLED
    pending: cancel
    effects: [close_pending, clear_holder]

  decline_cancel:
    label: 취소 요청 거절
    event: CANCEL_DECLINED
    actors: [manager]
    transitions:
      IN_PROGRESS: null
      ANALYSIS_REVISION_REQUESTED: null
      ON_HOLD: null
    pending: cancel
    requires: [comment]
    effects: [close_pending]

  register_result:
    label: 결과 등록
    event: RESULT_REGISTERED
    actors: [assigned_analyst]
    transitions: { IN_PROGRESS: RESULT_REVIEW }
    # 3.4-4 대기 요청이 있으면 결과 등록을 막는다
    pending: none
    requires: [result_summary]
    effects: [add_result]

  request_rework:
    label: 결과 재작업 요청
    event: REWORK_REQUESTED
    actors: [requester]
    transitions: { RESULT_REVIEW: IN_PROGRESS }
    requires: [comment]

  confirm_result:
    label: 결과 확인
    event: REQUESTER_CONFIRMED
    actors: [requester]
    transitions: { RESULT_REVIEW: COMPLETED }

# 3.5 역할별 할 일 목록. 규칙 중 하나라도 맞으면 할 일이다.
# relation 은 actors 와 같은 이름을 쓴다.
todo:
  REQUESTER:
    - relation: requester
      statuses: [DRAFT, REVISION_REQUESTED, ANALYSIS_REVISION_REQUESTED, RESULT_REVIEW]
  MANAGER:
    - statuses: [UNDER_REVIEW]
    - pending: cancel
  ANALYST:
    - relation: assigned_analyst
      statuses: [IN_PROGRESS]
    - relation: holder
      statuses: [ON_HOLD]
