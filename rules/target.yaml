# 의뢰 대상 — 업무정의서 4.2, 3.4-9
#
# 경로 조건은 제품 분류의 키(division, product_lineup, platform, chassis) 중 일부를 적는다. 적은 키가 모두 같으면 해당한다.

# 해석 범위를 고르는 제품: RAC Window (사업부 RAC, Line-up Window, Platform Window).
# 실내·실외 운전을 구분하는 제품은 이것뿐이라 별도의 운전 구분 항목은 없다 (G-18)
analysis_scope_products:
  - { division: RAC, product_lineup: Window, platform: Window }

# 냉각 방식을 고르는 해석유형
cooling_method_types: [PCB_HEAT]

# 이 냉각 방식이면 PCB 조건에 냉매 조건이 생긴다 (매핑의 pcb_refrigerant 열)
water_cooling: 수랭식

# 3.4-9 의뢰번호 [검토 필요]. NNN 은 날짜별 일련번호다
request_no_format: "CFD-{date:%Y%m%d}-{seq:03d}"
