# 해석유형 11종 — 업무정의서 부록 A
#
# 코드는 정의서에 없어 구현에서 정했다 (docs/spec-gaps.md G-17).
# 풍량, 기류 패턴, 이슬맺힘, 열교환기 유속 프로파일 외 7종의 설명은 초안이다 [검토 필요].

AIRFLOW_RATE:
  label: 풍량
  description: 제품의 흡입·토출 또는 관심 위치에서의 풍량을 확인하는 해석입니다. 형상 또는 운전조건 변경에 따른 풍량 변화와 제품 간 차이를 비교할 수 있습니다.
  suitable_for:
    - 제품의 풍량이 충분한지 확인하려는 경우
    - 설계 변경 전후의 풍량 차이를 비교하려는 경우
    - 풍량 부족 원인을 검토하려는 경우

AIRFLOW_PATTERN:
  label: 기류 패턴
  description: 제품 내부 또는 외부에서 공기가 어떤 방향과 형태로 흐르는지 확인하는 해석입니다.
  suitable_for:
    - 바람이 어느 방향으로 흐르는지 확인하려는 경우
    - 특정 방향으로 기류가 편중되는 원인을 확인하려는 경우
    - 형상 변경 전후의 유동 분포를 비교하려는 경우

CONDENSATION:
  label: 이슬맺힘
  description: 제품에서 이슬맺힘이 발생할 가능성이 있는 위치와 관련 원인을 검토하는 해석입니다.
  suitable_for:
    - 제품 표면이나 특정 부위에 이슬맺힘이 발생하는 경우
    - 이슬맺힘 발생 원인을 검토하려는 경우
    - 개선안 적용 시 이슬맺힘이 줄어드는지 비교하려는 경우

HX_VELOCITY_PROFILE:
  label: 열교환기 유속 프로파일
  description: 열교환기를 통과하는 공기의 유속 분포를 확인하는 해석입니다.
  suitable_for:
    - 열교환기 전면의 유속이 균일한지 확인하려는 경우
    - 열교환기 특정 영역의 유속이 낮거나 높은지 확인하려는 경우
    - 설계 변경에 따른 열교환기 유속 분포를 비교하려는 경우

AIRFLOW_REACH:
  label: 기류 도달 거리
  description: 제품에서 토출된 기류가 공간에서 얼마나 멀리, 어떤 분포로 도달하는지 확인하는 해석입니다. 기류 측정 유속까지 도달한 거리를 도달 거리로 봅니다.
  suitable_for:
    - 토출 기류가 공간의 목표 위치까지 도달하는지 확인하려는 경우
    - 토출구·루버 형상 변경에 따른 도달 거리를 비교하려는 경우
    - 운전 조건별 도달 거리를 비교하려는 경우

PDB:
  label: PDB
  description: PDB의 발열 부품 온도와 주변 기류에 의한 냉각 성능을 확인하는 해석입니다.
  suitable_for:
    - PDB 내부 온도가 기준을 넘는지 확인하려는 경우
    - 냉각 구조나 통풍구 변경 효과를 비교하려는 경우
    - 설치 환경에 따른 온도 변화를 확인하려는 경우

REAL_USE:
  label: 실사용 해석
  description: 실제 사용 공간과 설치 조건을 반영해 제품 주변의 기류와 온도 분포를 확인하는 해석입니다.
  suitable_for:
    - 실제 설치 공간에서의 기류·온도 분포를 확인하려는 경우
    - 설치 위치나 방향에 따른 차이를 비교하려는 경우
    - 지정한 위치의 기류 속도나 온도를 확인하려는 경우

DUST_BEHAVIOR:
  label: 집진해석(먼지거동)
  description: 먼지 입자가 제품 내부와 주변에서 어떻게 이동하고, 필터나 특정 부위에 어떻게 포집·퇴적되는지 확인하는 해석입니다.
  suitable_for:
    - 먼지가 쌓이는 위치를 확인하려는 경우
    - 필터나 유로 변경에 따른 포집 차이를 비교하려는 경우
    - 입자 크기에 따른 거동 차이를 확인하려는 경우

PCB_HEAT:
  label: PCB발열
  description: PCB 소자의 발열에 따른 PCB와 주변의 온도 분포를 확인하는 해석입니다. 공랭식과 수랭식 냉각을 다룹니다.
  suitable_for:
    - 소자 온도가 허용 온도를 넘는지 확인하려는 경우
    - 히트싱크나 냉각 방식 변경 효과를 비교하려는 경우
    - 소자 배치 변경에 따른 온도 차이를 비교하려는 경우

MULTIPHASE:
  label: 다상유동
  description: 냉매처럼 기체와 액체가 함께 흐르는 유동에서 상의 분포와 이동 거동을 확인하는 해석입니다.
  suitable_for:
    - 배관이나 열교환기 안의 기액 분포를 확인하려는 경우
    - 분배가 균일한지 확인하려는 경우
    - 입구 상태 변화에 따른 거동을 비교하려는 경우

REFRIGERANT_LEAK:
  label: 냉매누설
  description: 냉매가 누설될 때 공간에서의 확산 경로와 농도 분포를 확인하는 해석입니다.
  suitable_for:
    - 누설 시 냉매 농도가 높아지는 위치를 확인하려는 경우
    - 누설 위치나 양에 따른 확산 차이를 비교하려는 경우
    - 환기나 설치 조건에 따른 차이를 확인하려는 경우
